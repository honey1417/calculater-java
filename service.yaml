apiVersion: v1
kind: Service
metadata:
  name: calculator-release-service
spec:
  type: LoadBalancer
  selector:
    app: calculator-release
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: calculator-snapshot-service
spec:
  type: LoadBalancer
  selector:
    app: calculator-snapshot
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8081

